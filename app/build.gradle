plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.kent.code'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.kent.code'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    buildTypes {
        // Experimental GitHub CI debug APKs use ephemeral signing certificates.
        // Keep the original 0.1 app installed when testing RED PIXEL.
        debug {
            applicationIdSuffix '.red'
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
    }
}
