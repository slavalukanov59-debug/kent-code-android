plugins {
    id 'com.android.application'
}

def labAssets = layout.buildDirectory.dir('generated/lab-assets')
def syncLabSource = tasks.register('syncLabSource', Sync) {
    from(rootProject.projectDir) {
        include 'app/src/main/java/**/*.java', 'app/src/main/res/**/*.xml',
                'app/src/main/AndroidManifest.xml', 'app/build.gradle', 'build.gradle'
        into 'lab-source'
    }
    into labAssets
}

android {
    namespace 'ai.kent.code'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.kent.code'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '0.7'
    }
    sourceSets.main.assets.srcDir labAssets
    buildTypes {
        // Experimental GitHub CI debug APKs use ephemeral signing certificates.
        // Keep the original 0.1 app installed when testing RED PIXEL.
        debug {
            applicationIdSuffix '.red'
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
    }
}

tasks.named('preBuild').configure {
    dependsOn syncLabSource
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
