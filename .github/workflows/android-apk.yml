name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      apk_artifact_id: ${{ steps.apk_artifact.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: &checkout_action actions/checkout@v7
        with: &checkout_inputs
          persist-credentials: false
      - name: JDK 17
        uses: &java_action actions/setup-java@v6
        with: &java_inputs
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: &gradle_action gradle/actions/setup-gradle@v6
        with: &gradle_inputs
          gradle-version: '8.13'
      - name: Test file workspace
        run: |
          mkdir -p /tmp/kent-tests
          javac -d /tmp/kent-tests \
            app/src/main/java/ai/kent/code/SafeWorkspace.java \
            app/src/main/java/ai/kent/code/CommandResult.java \
            app/src/main/java/ai/kent/code/WorkspaceZipExporter.java \
            app/src/main/java/ai/kent/code/ShellRunner.java \
            tests/WorkspaceSmokeTest.java \
            tests/WorkspaceZipExporterSmokeTest.java \
            tests/ShellRunnerSmokeTest.java \
            app/src/main/java/ai/kent/code/ApiKeyValidator.java \
            tests/ApiKeyValidatorSmokeTest.java \
            app/src/main/java/ai/kent/code/ApiRetryPolicy.java \
            tests/ApiRetryPolicySmokeTest.java
          java -cp /tmp/kent-tests ai.kent.code.WorkspaceSmokeTest
          java -cp /tmp/kent-tests ai.kent.code.WorkspaceZipExporterSmokeTest
          java -cp /tmp/kent-tests ai.kent.code.ShellRunnerSmokeTest
          java -cp /tmp/kent-tests ai.kent.code.ApiKeyValidatorSmokeTest
          java -cp /tmp/kent-tests ai.kent.code.ApiRetryPolicySmokeTest
      - name: Test local bridge
        run: python3 tests/test_kent_bridge.py
      # ubuntu-latest has the Android SDK command-line tools preinstalled.
      # setup-android@v3 fails currently because it requests the removed 'tools' package.
      - name: Prepare Android SDK 35
        shell: bash
        run: &prepare_sdk |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools not found at $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found"
            exit 1
          fi
          echo "Using SDK: $SDK_ROOT"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses < <(yes) >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run Android unit tests, lint and compile APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Prepare APK and checksum
        shell: bash
        run: &prepare_apk |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" KENT-CODE-debug.apk
          sha256sum KENT-CODE-debug.apk > KENT-CODE-debug.apk.sha256
      - name: Upload APK to this GitHub Actions run
        id: apk_artifact
        uses: actions/upload-artifact@v7
        continue-on-error: >-
          ${{ github.ref == 'refs/heads/main' ||
              github.ref == 'refs/heads/feature/kent-0.7-zip-export' ||
              github.head_ref == 'feature/kent-0.7-zip-export' }}
        with:
          name: KENT-CODE-debug-${{ github.run_number }}
          path: |
            KENT-CODE-debug.apk
            KENT-CODE-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    # Publish main builds and manually requested ZIP export previews.
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
      (github.ref == 'refs/heads/feature/kent-0.7-zip-export' && github.event_name == 'workflow_dispatch')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download tested APK
        id: archive
        if: needs.build.outputs.apk_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.apk_artifact_id }}
      - name: Checkout for release fallback
        if: steps.archive.outcome != 'success'
        uses: *checkout_action
        with: *checkout_inputs
      - name: Set up JDK for release fallback
        if: steps.archive.outcome != 'success'
        uses: *java_action
        with: *java_inputs
      - name: Set up Gradle for release fallback
        if: steps.archive.outcome != 'success'
        uses: *gradle_action
        with: *gradle_inputs
      - name: Prepare SDK for release fallback
        if: steps.archive.outcome != 'success'
        shell: bash
        run: *prepare_sdk
      - name: Assemble APK for release fallback
        if: steps.archive.outcome != 'success'
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare fallback APK and checksum
        if: steps.archive.outcome != 'success'
        shell: bash
        run: *prepare_apk
      - name: Publish downloadable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check KENT-CODE-debug.apk.sha256
          TAG="kent-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "KENT-CODE-debug.apk" \
            "KENT-CODE-debug.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KENT CODE Android · build #${GITHUB_RUN_NUMBER}" \
            --notes "Experimental debug build. Install on your own device for testing. API key is entered on-device; no key is bundled into the APK." \
            --prerelease
