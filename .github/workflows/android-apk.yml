name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Required to publish a downloadable APK as a GitHub Release.
# Actions artifact storage quota is currently exhausted for this account.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test file workspace
        run: |
          mkdir -p /tmp/kent-tests
          javac -d /tmp/kent-tests app/src/main/java/ai/kent/code/SafeWorkspace.java tests/WorkspaceSmokeTest.java
          java -cp /tmp/kent-tests ai.kent.code.WorkspaceSmokeTest
      # ubuntu-latest has the Android SDK command-line tools preinstalled.
      # setup-android@v3 fails currently because it requests the removed 'tools' package.
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools not found at $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found"
            exit 1
          fi
          echo "Using SDK: $SDK_ROOT"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses < <(yes) >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      # No upload-artifact: GitHub has reported the Actions storage quota is full.
      # PRs still compile and test, main builds are published via Releases.
      - name: Publish downloadable APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="kent-build-${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" KENT-CODE-debug.apk
          sha256sum KENT-CODE-debug.apk > KENT-CODE-debug.apk.sha256
          gh release create "$TAG" \
            "KENT-CODE-debug.apk" \
            "KENT-CODE-debug.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "KENT CODE Android · build #${GITHUB_RUN_NUMBER}" \
            --notes "Experimental debug build. Install on your own device for testing. API key is entered on-device; no key is bundled into the APK." \
            --prerelease
